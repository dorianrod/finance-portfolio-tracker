<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="__FINANCE_DEFAULT_THEME_COLOR__" />
    <script>
      ;(() => {
        const key = 'finance-dashboard-theme:v1'
        let theme
        try {
          const value = localStorage.getItem(key)
          const stored =
            value === null
              ? localStorage.getItem('finance-dashboard-theme')
              : JSON.parse(value)
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch {}
        theme ??= matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        document.documentElement.dataset.theme = theme
        const colors = __FINANCE_THEME_COLORS__
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', colors[theme])
      })()
    </script>
    <title>Finance portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
